name: CI Pipeline
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Python Syntax
        run: |
          echo "Starting build..."
          python -m py_compile main.py diagnose.py
          echo "All Python files compiled cleanly with exit code 0!"